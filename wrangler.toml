name = "ershouqingdan"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The site's own domain. The workers.dev address stays on so old links keep working: its pages
# move to SITE_ORIGIN (see [vars]), taking the browser's saved lists along.
routes = [
  { pattern = "secondhandlist.org", custom_domain = true },
  { pattern = "www.secondhandlist.org", custom_domain = true },
]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "banjia"
database_id = "d62a5b22-d587-42cd-8902-d0327bdeb0b7"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
# Where pages on workers.dev and www move to; empty keeps every address serving pages.
SITE_ORIGIN = ""
# OAuth Web client ID (Google Cloud project "ershouqingdan"):
#   701807910613-h3753h0s5h1pljr88ovddvg9oc9uq6oi.apps.googleusercontent.com
# Empty hides Google sign-in. Off for now: sharing happens inside WeChat, where Google sign-in is blocked.
GOOGLE_CLIENT_ID = ""
# Web tip page for people outside WeChat (English and Telegram users); empty hides it.
TIP_URL = "https://ko-fi.com/jindali"
# INVITE_CODE (unlimited AI photo recognition) is a secret: `wrangler secret put INVITE_CODE`;
# for local dev put it in .dev.vars.

[ai]
binding = "AI"
